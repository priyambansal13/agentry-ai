apiVersion: v1
kind: Service
metadata: { name: dashboard }
spec:
  selector: { app: dashboard }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dashboard }
spec:
  replicas: 1
  selector: { matchLabels: { app: dashboard } }
  template:
    metadata: { labels: { app: dashboard } }
    spec:
      initContainers:
        # first deploy: wait for the migrate Job to create Better Auth's tables and the app schema
        - name: wait-for-migrations
          image: pgvector/pgvector:pg16
          env:
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: agentry-env, key: POSTGRES_PASSWORD } } }
          command: ["sh", "-c", "until [ \"$(psql -h postgres -U postgres -d agentry -tAc \"select count(*) from information_schema.tables where (table_schema, table_name) in (('auth','jwks'), ('app','alembic_version'))\" 2>/dev/null)\" = 2 ]; do echo waiting for migrations; sleep 3; done"]
      containers:
        - name: dashboard
          image: agentry-dashboard
          envFrom: [{ secretRef: { name: agentry-env } }]
          env:
            - { name: AGENTRY_API_URL, value: "http://api:8801" }
            - { name: AGENTRY_DB_AUTH_PASSWORD, valueFrom: { secretKeyRef: { name: agentry-env, key: AGENTRY_DB_AUTH_PASSWORD } } }
            - { name: AUTH_DATABASE_URL, value: "postgres://agentry_auth:$(AGENTRY_DB_AUTH_PASSWORD)@postgres:5432/agentry" }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/auth/ok, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/auth/ok, port: 3000 }, periodSeconds: 20, failureThreshold: 3 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
