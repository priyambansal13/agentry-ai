apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 8801 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { fsGroup: 10001 }  # the image's agentry user can write the recordings volume
      volumes: [{ name: recordings, persistentVolumeClaim: { claimName: recordings } }]
      initContainers:
        # first deploy: wait for the migrate Job to create Better Auth's tables and the app schema
        - name: wait-for-migrations
          image: pgvector/pgvector:pg16
          env:
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: agentry-env, key: POSTGRES_PASSWORD } } }
          command: ["sh", "-c", "until [ \"$(psql -h postgres -U postgres -d agentry -tAc \"select count(*) from information_schema.tables where (table_schema, table_name) in (('auth','jwks'), ('app','alembic_version'))\" 2>/dev/null)\" = 2 ]; do echo waiting for migrations; sleep 3; done"]
      containers:
        - name: api
          image: agentry-backend
          command: ["agentry", "api", "--host", "0.0.0.0", "--no-reload"]
          envFrom: [{ secretRef: { name: agentry-env } }]
          env:
            - { name: AGENTRY_DB_HOST, value: postgres }
            - { name: AGENTRY_DB_PORT, value: "5432" }
            - { name: AGENTRY_AUTH_JWKS_URL, value: "http://dashboard:3000/api/auth/jwks" }
          ports: [{ containerPort: 8801 }]
          readinessProbe: { httpGet: { path: /ready, port: 8801 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8801 }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /health, port: 8801 }, periodSeconds: 3, failureThreshold: 40 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: recordings, mountPath: /srv/var/recordings }]
