# Postgres 16 + pgvector on the node's disk (k3s local-path). Backups: cronjobs.yaml (nightly pg_dump).
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          envFrom: [{ secretRef: { name: agentry-env } }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: agentry }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "postgres", "-d", "agentry"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["pg_isready", "-U", "postgres", "-d", "agentry"] }, periodSeconds: 20, failureThreshold: 6 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
