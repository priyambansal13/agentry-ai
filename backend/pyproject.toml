[project]
name = "agentry"
version = "0.1.0"
description = "Agentry platform backend: API, workflows, agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "dbos>=1.0",
  "litellm>=1.50",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
  "email-validator>=2.2",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "pgvector>=0.3",
  "selectolax>=0.3",
  "mcp>=1.10",
  "phonenumbers>=8.13",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "livekit-agents[openai,silero]>=1.2",
  "livekit-api>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
agentry = "agentry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
