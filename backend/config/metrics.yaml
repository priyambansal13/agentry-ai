# Metric registry: one definition per number shown anywhere (dashboard, reports, billing).
# Order here = order on the client dashboard. Synced into app.metric_definitions by `agentry sync-metrics`.
# aggregation: count of events, or sum of a numeric payload field (value_path).
metrics:
  - key: amount_recovered
    name: Money recovered
    automation_key: invoice_follow_up
    event_type: payment.received
    aggregation: sum
    value_path: amount
    unit: currency
  - key: appointments_booked
    name: Appointments booked
    automation_key: lead_engine
    event_type: booking.created
    aggregation: count
    unit: count
  - key: calls_answered
    name: Calls answered
    automation_key: ai_receptionist
    event_type: call.completed
    aggregation: count
    unit: count
  - key: leads_captured
    name: Leads captured
    automation_key: lead_engine
    event_type: lead.created
    aggregation: count
    unit: count
  - key: emails_triaged
    name: Emails triaged
    automation_key: inbox_triage
    event_type: email.triaged
    aggregation: count
    unit: count
  - key: messages_sent
    name: Messages sent
    automation_key: null
    event_type: message.sent
    aggregation: count
    unit: count
  - key: posts_published
    name: Posts published
    automation_key: content_repurposing
    event_type: content.published
    aggregation: count
    unit: count
  - key: returns_filed
    name: Returns filed
    automation_key: ca_filing_tracker
    event_type: ca.filing_filed
    aggregation: count
    unit: count
  - key: documents_collected
    name: Client documents collected
    automation_key: ca_document_chaser
    event_type: ca.document_received
    aggregation: count
    unit: count
  - key: videos_published
    name: AI videos published
    automation_key: video_studio
    event_type: video.published
    aggregation: count
    unit: count
  - key: tickets_resolved
    name: Tickets resolved
    automation_key: support_desk
    event_type: ticket.resolved
    aggregation: count
    unit: count
  - key: quotes_won
    name: Quotes won
    automation_key: catalog_quotes
    event_type: quote.won
    aggregation: count
    unit: count
  - key: renewals_won
    name: Renewals
    automation_key: renewals
    event_type: renewal.won
    aggregation: count
    unit: count
  - key: candidates_screened
    name: Candidates screened
    automation_key: hiring
    event_type: candidate.screened
    aggregation: count
    unit: count
